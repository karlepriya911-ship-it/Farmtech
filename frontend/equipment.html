<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment | FarmTech</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar navbar-dark bg-success"><div class="container"><a class="navbar-brand" href="index.html">🌾 FarmTech</a></div></nav><main class="container py-4"><h2>Available Equipment</h2><input id="search" class="form-control mb-4" placeholder="Search by name, category, or location"><div id="equipment" class="row g-3"><p>Loading equipment...</p></div></main><script>const box=document.querySelector('#equipment'),input=document.querySelector('#search');async function load(){const r=await fetch('../backend/equipment/view_equipment.php?search='+encodeURIComponent(input.value));const items=await r.json();box.innerHTML=items.length?items.map(e=>`<div class="col-md-4"><div class="card shadow-sm p-3 h-100"><h5>${e.name}</h5><span class="text-muted">${e.category} · ${e.location}</span><p class="my-2">${e.description||'Reliable agricultural equipment.'}</p><strong>₹${e.price_per_day}/day</strong></div></div>`).join(''):'<p>No approved equipment found.</p>'}input.addEventListener('input',load);load();</script></body></html>
